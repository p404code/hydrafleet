<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hydralink</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hydralink">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Hydralink">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f1f5f9;
            --border: #e2e8f0; --text: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --green: #3ecf8e; --red: #f43f5e;
        }
        [data-theme="dark"] {
            --bg: #020617; --bg-card: #0f172a; --bg-hover: #1e293b;
            --border: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #475569;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; transition: background 0.2s; }
        .login-container { width: 100%; max-width: 400px; }
        .login-card { background: var(--bg-card); border-radius: 8px; padding: 36px 32px; border: 1px solid var(--border); }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo-icon { width: 64px; height: 64px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 64px; height: 64px; }
        .logo h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text); letter-spacing: 1px; }
        .logo p { color: var(--text-secondary); font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-group input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.12); }
        .form-group input::placeholder { color: var(--text-muted); }
        .pin-container { display: flex; gap: 10px; justify-content: center; }
        .pin-input { width: 52px; height: 56px; text-align: center; font-size: 22px; font-weight: 600; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; -moz-appearance: textfield; }
        .pin-input::-webkit-outer-spin-button, .pin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .pin-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.12); }
        .pin-input.filled { border-color: var(--green); }
        .btn-login { width: 100%; padding: 10px 24px; background: var(--green); border: none; border-radius: 4px; font-size: 14px; font-weight: 600; color: #020617; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-top: 4px; }
        .btn-login:hover { opacity: 0.88; }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-message { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 14px; min-height: 18px; }
        .theme-toggle { position: fixed; top: 16px; right: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; line-height: 1; }
        .theme-toggle:hover { background: var(--bg-hover); color: var(--text); }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .pin-input { width: 44px; height: 50px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Theme wechseln">Hell</button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <line x1="50" y1="20" x2="25" y2="70" stroke="#F5B51B" stroke-width="6" stroke-linecap="round"/>
                        <line x1="25" y1="70" x2="75" y2="70" stroke="#F5B51B" stroke-width="6" stroke-linecap="round"/>
                        <line x1="75" y1="70" x2="50" y2="20" stroke="#F5B51B" stroke-width="6" stroke-linecap="round"/>
                        <circle cx="50" cy="20" r="10" fill="#F5B51B"/>
                        <circle cx="25" cy="70" r="10" fill="#F5B51B"/>
                        <circle cx="75" cy="70" r="10" fill="#F5B51B"/>
                    </svg>
                </div>
                <h1>HYDRALINK</h1>
                <p>Abrechnungs-Dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Benutzer</label>
                    <input type="text" id="username" placeholder="Benutzername" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>PIN</label>
                    <div class="pin-container">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="0">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="1">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="2">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="3">
                    </div>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <button type="submit" class="btn-login" id="loginBtn">Anmelden</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://pkxcwfkfaaorwnbdmylg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBreGN3ZmtmYWFvcnduYmRteWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTE1ODUsImV4cCI6MjA3OTMyNzU4NX0.xBDHKKXA9DFFwcTO18aDH_VHJr9BZyI__lv-L4Apryo';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const pinInputs = document.querySelectorAll('.pin-input');

        pinInputs.forEach((input, idx) => {
            input.addEventListener('input', function(e) {
                this.value = this.value.slice(-1);
                if (this.value) {
                    this.classList.add('filled');
                    if (idx < 3) pinInputs[idx + 1].focus();
                } else {
                    this.classList.remove('filled');
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    pinInputs[idx - 1].focus();
                    pinInputs[idx - 1].value = '';
                    pinInputs[idx - 1].classList.remove('filled');
                }
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').requestSubmit();
                }
            });

            input.addEventListener('focus', function() { this.select(); });
        });

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dunkel';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Hell';
                localStorage.setItem('theme', 'dark');
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (saved === 'light') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dunkel';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Hell';
            }
        }

        function checkSession() {
            const session = localStorage.getItem('hydralink_session');
            if (session) {
                try {
                    const s = JSON.parse(session);
                    if (Date.now() - s.timestamp < 24 * 60 * 60 * 1000) {
                        window.location.href = 'dashboard.html';
                    }
                } catch(e) {}
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            checkSession();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const pin = Array.from(pinInputs).map(i => i.value).join('');
                const errorEl = document.getElementById('errorMessage');
                const loginBtn = document.getElementById('loginBtn');

                errorEl.textContent = '';

                if (pin.length !== 4) {
                    errorEl.textContent = 'Bitte 4-stelligen PIN eingeben';
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Prüfe...';

                try {
                    const { data, error } = await sb
                        .from('app_users')
                        .select('name, role')
                        .ilike('name', username)
                        .eq('pin', pin)
                        .maybeSingle();

                    if (error) throw error;

                    if (data) {
                        localStorage.setItem('hydralink_session', JSON.stringify({
                            username: data.name,
                            name: data.name,
                            role: data.role,
                            timestamp: Date.now()
                        }));
                        window.location.href = 'dashboard.html';
                    } else {
                        errorEl.textContent = 'Ungültiger Benutzer oder PIN';
                        pinInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                        pinInputs[0].focus();
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    errorEl.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Anmelden';
                }
            });
        });
    </script>
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }</script>
</body>
</html>
