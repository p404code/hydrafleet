<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hydralink</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#FBFBFC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hydralink">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Hydralink">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:#FBFBFC; --surface:#FFFFFF; --surface-2:#F1F3F5;
            --border:#E6E8EB; --border-strong:#CFD4DA;
            --text:#101418; --text-mut:#6B7280; --text-dim:#B0B6BF;
            --accent:#0B6B4F; --accent-ink:#FFFFFF; --accent-faint:rgba(11,107,79,.08);
            --err:#B42318;
            --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; /* Systemschrift: durchgestrichene Null */
            --sans:-apple-system,"Inter","Segoe UI",system-ui,sans-serif;
        }
        [data-theme="dark"] {
            --bg:#0F1115; --surface:#15181D; --surface-2:#1A1E24;
            --border:#23272F; --border-strong:#323843;
            --text:#EDEEF0; --text-mut:#989FA7; --text-dim:#5F666E;
            --accent:#3ECF8E; --accent-ink:#062D1C; --accent-faint:rgba(62,207,142,.1);
            --err:#F0555D;
        }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; -webkit-font-smoothing: antialiased; font-size: 13px; }
        .login-container { width: 100%; max-width: 380px; animation: fadeIn .3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .login-card { background: var(--surface); border-radius: 12px; padding: 32px 28px 24px; border: 1px solid var(--border); }
        .logo { text-align: center; margin-bottom: 26px; }
        .logo-icon { display: none; }
        .logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -.4px; color: var(--text); }
        .logo h1 span { font-weight: 400; color: var(--text-mut); }
        .logo p { color: var(--text-mut); font-size: 12.5px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 10.5px; font-weight: 600; margin-bottom: 6px; color: var(--text-mut); text-transform: uppercase; letter-spacing: .05em; }
        .form-group input { width: 100%; height: 40px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; font-size: 14px; color: var(--text); outline: none; font-family: inherit; }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
        .form-group input::placeholder { color: var(--text-dim); }
        .pin-container { display: flex; gap: 10px; justify-content: center; }
        .pin-input { width: 56px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; font-family: var(--mono); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text); outline: none; -moz-appearance: textfield; }
        .pin-input::-webkit-outer-spin-button, .pin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
        .pin-input.filled { border-color: var(--accent); background: var(--accent-faint); }
        .btn-login { width: 100%; height: 42px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 4px; font-family: inherit; }
        .btn-login:hover { opacity: .92; }
        .btn-login:disabled { opacity: .5; cursor: not-allowed; }
        .error-message { color: var(--err); font-size: 12.5px; text-align: center; margin-bottom: 10px; min-height: 16px; font-weight: 500; }
        .driver-link { display: block; text-align: center; margin-top: 16px; font-size: 12.5px; font-weight: 500; color: var(--text-mut); text-decoration: none; }
        .driver-link:hover { color: var(--text); text-decoration: underline; }
        .theme-toggle { position: fixed; top: 12px; right: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 500; color: var(--text-mut); cursor: pointer; font-family: inherit; }
        .theme-toggle:hover { background: var(--surface-2); color: var(--text); }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 20px; }
            .pin-input { width: 50px; height: 52px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Theme wechseln">Dunkel</button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>HYDRA<span>link</span></h1>
                <p>Abrechnungs-Dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Benutzer</label>
                    <input type="text" id="username" placeholder="Benutzername" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>PIN</label>
                    <div class="pin-container">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="0">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="1">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="2">
                        <input type="number" class="pin-input" maxlength="1" inputmode="numeric" data-pin="3">
                    </div>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <button type="submit" class="btn-login" id="loginBtn">Anmelden</button>
            </form>
            <a class="driver-link" href="/fahrer/">Fahrer? Hier anmelden</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://pkxcwfkfaaorwnbdmylg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBreGN3ZmtmYWFvcnduYmRteWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTE1ODUsImV4cCI6MjA3OTMyNzU4NX0.xBDHKKXA9DFFwcTO18aDH_VHJr9BZyI__lv-L4Apryo';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const pinInputs = document.querySelectorAll('.pin-input');

        pinInputs.forEach((input, idx) => {
            input.addEventListener('input', function(e) {
                this.value = this.value.slice(-1);
                if (this.value) {
                    this.classList.add('filled');
                    if (idx < 3) pinInputs[idx + 1].focus();
                } else {
                    this.classList.remove('filled');
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    pinInputs[idx - 1].focus();
                    pinInputs[idx - 1].value = '';
                    pinInputs[idx - 1].classList.remove('filled');
                }
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').requestSubmit();
                }
            });

            input.addEventListener('focus', function() { this.select(); });
        });

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dunkel';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Hell';
                localStorage.setItem('theme', 'dark');
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (saved === 'dark') {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Hell';
            } else {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dunkel';
            }
        }

        const AUTH_DOMAIN = '@hydralink.local';
        const pinToPassword = (pin) => 'HL#' + pin + '#hydralink';
        async function checkSession() {
            try {
                const { data } = await sb.auth.getSession();
                const session = data && data.session;
                if (!session) { localStorage.removeItem('hydralink_session'); return; }
                // Rolle allein aus app_metadata: Büro -> Dashboard, Fahrer -> /fahrer/, sonst abmelden
                const meta = (session.user && session.user.app_metadata) || {};
                if (meta.app_role === 'admin' || meta.app_role === 'user') {
                    // Nur weiter, wenn dashboard.html den hydralink_session-Eintrag auch akzeptiert (gleiche Regel, 30 Tage) –
                    // sonst schickt es sofort hierher zurück: Endlos-Weiterleitung index <-> dashboard (auch von /fahrer/ aus).
                    let hs = null; try { hs = JSON.parse(localStorage.getItem('hydralink_session') || 'null'); } catch (e2) { hs = null; }
                    if (hs && hs.timestamp && Date.now() - hs.timestamp <= 30 * 24 * 60 * 60 * 1000) { window.location.href = 'dashboard.html'; return; }
                    await sb.auth.signOut({ scope: 'local' }); // nur dieses Gerät, andere Büro-Geräte bleiben angemeldet
                    localStorage.removeItem('hydralink_session');
                    return;
                }
                if (!meta.app_role && meta.fahrer_nr != null && meta.fahrer_nr !== '') { window.location.replace('/fahrer/'); return; }
                await sb.auth.signOut();
                localStorage.removeItem('hydralink_session');
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            checkSession();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const pin = Array.from(pinInputs).map(i => i.value).join('');
                const errorEl = document.getElementById('errorMessage');
                const loginBtn = document.getElementById('loginBtn');

                errorEl.textContent = '';

                if (pin.length !== 4) {
                    errorEl.textContent = 'Bitte 4-stelligen PIN eingeben';
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Prüfe...';

                try {
                    const email = username.toLowerCase().replace(/\s+/g, '') + AUTH_DOMAIN;
                    const { data, error } = await sb.auth.signInWithPassword({ email, password: pinToPassword(pin) });

                    if (error && error.status !== 400) throw error;

                    const meta = data && data.user ? (data.user.app_metadata || {}) : {};
                    if (data && data.session && meta.app_role) {
                        localStorage.setItem('hydralink_session', JSON.stringify({
                            username: meta.app_name || username,
                            name: meta.app_name || username,
                            role: meta.app_role,
                            timestamp: Date.now()
                        }));
                        window.location.href = 'dashboard.html';
                    } else {
                        if (data && data.session) await sb.auth.signOut();
                        errorEl.textContent = 'Ungültiger Benutzer oder PIN';
                        pinInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                        pinInputs[0].focus();
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    errorEl.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Anmelden';
                }
            });
        });
    </script>
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }</script>
</body>
</html>
