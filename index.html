<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Abrechnungen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f8fafc;
            --border: #e2e8f0; --text: #1e293b; --text-secondary: #64748b; --text-muted: #94a3b8;
            --blue: #3b82f6; --blue-hover: #2563eb; --green: #10b981; --red: #ef4444;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --bg-card: #1e293b; --bg-hover: #334155;
            --border: #334155; --text: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 420px; }
        .login-card { background: var(--bg-card); border-radius: 20px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #3b82f6, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo p { color: var(--text-secondary); font-size: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg); border: 2px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .form-group input::placeholder { color: var(--text-muted); }
        .btn-login { width: 100%; padding: 14px 24px; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; }
        .btn-login:hover { box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-login:active { transform: scale(0.98); }
        .error-message { color: var(--red); font-size: 14px; text-align: center; margin-bottom: 16px; min-height: 20px; }
        .demo-info { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
        .demo-info p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .demo-info code { display: block; background: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 13px; color: var(--text-secondary); font-family: 'SF Mono', Consolas, monospace; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 18px; cursor: pointer; }
        .theme-toggle:hover { background: var(--bg-hover); }
        @media (max-width: 480px) {
            .login-card { padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Theme wechseln">☀️</button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>HydraFleet</h1>
                <p>Abrechnungs-Dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" placeholder="admin@hydrafleet.de" required>
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <button type="submit" class="btn-login">Anmelden</button>
            </form>

            <div class="demo-info">
                <p>Demo-Zugangsdaten:</p>
                <code>admin@hydrafleet.de / admin123</code>
            </div>
        </div>
    </div>

    <script>
        // Demo credentials
        const DEMO_USERS = [
            { email: 'admin@hydrafleet.de', password: 'admin123', name: 'Administrator' }
        ];

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (saved === 'light') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️';
            }
        }

        function checkSession() {
            const session = localStorage.getItem('hydrafleet_session');
            if (session) {
                try {
                    const s = JSON.parse(session);
                    if (Date.now() - s.timestamp < 24 * 60 * 60 * 1000) {
                        window.location.href = 'dashboard.html';
                    }
                } catch(e) {}
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            checkSession();

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('errorMessage');

                errorEl.textContent = '';

                const user = DEMO_USERS.find(u =>
                    u.email.toLowerCase() === email.toLowerCase() && u.password === password
                );

                if (user) {
                    localStorage.setItem('hydrafleet_session', JSON.stringify({
                        email: user.email,
                        name: user.name,
                        timestamp: Date.now()
                    }));
                    window.location.href = 'dashboard.html';
                } else {
                    errorEl.textContent = 'Ungültige E-Mail oder Passwort';
                }
            });
        });
    </script>
</body>
</html>
